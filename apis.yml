aid: pinkfish
name: Pinkfish
description: >-
  Pinkfish is an enterprise agentic AI and business orchestration platform that
  runs multi-step workflows across an organization's stack, combining AI agents
  with real system integrations, permissions, and auditability for critical
  operations. The platform pairs a natural-language "Coworker" and visual
  agentic workflow editor with domain-specific Agents, a Guardian monitoring and
  self-healing layer, and a library of 1,500+ ready-to-deploy MCP tools spanning
  500+ enterprise integrations (Salesforce, Slack, Stripe, Zendesk, Jira, and
  more). Published workflows are exposed programmatically through the Triggers
  API (an API-key authenticated HTTP surface supporting synchronous and
  asynchronous execution, webhook triggers, and run polling) and through the
  embedded Pinkfish Sidekick MCP server. Pinkfish was surfaced as a portfolio
  company of Norwest Venture Partners and was acquired by Genesys.
